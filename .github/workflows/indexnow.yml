name: IndexNow

permissions:
  contents: read

# Starts on the marker commit, then waits until production serves
# public/release-1b.txt. A 200 from /gas or /release-1a.txt is the previous deployment.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/indexnow/release-1a.txt
      - public/release-1a.txt
      - data/indexnow/release-1b.txt
      - public/release-1b.txt
      - .github/workflows/indexnow.yml

jobs:
  submit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run indexnow:once
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
