name: IndexNow submit

permissions:
  contents: read

# Changed mode after a successful production deploy of main.
# workflow_dispatch submits every sitemap URL (--all).
# The checkpoint is the previous successful run's indexnow-marker artifact,
# downloaded with GITHUB_TOKEN. No Blob store and no Redis store.
# A missing artifact submits every URL and the job still succeeds.
# The key is the checked-in public file. Do not echo the environment.
# deployment.ref may be refs/heads/main, main, or the commit SHA.
# The same rule is indexNowDeploymentOnMain in src/lib/indexnow.ts.
on:
  deployment_status:
  workflow_dispatch:

concurrency:
  group: indexnow-production
  cancel-in-progress: false

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'deployment_status' &&
        github.event.deployment_status.state == 'success' &&
        contains(fromJSON('["Production","production"]'), github.event.deployment.environment)
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - name: Confirm the deployment is on main
        id: main
        if: github.event_name == 'deployment_status'
        env:
          DEPLOY_REF: ${{ github.event.deployment.ref }}
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
        run: |
          set -euo pipefail
          ref="${DEPLOY_REF}"
          sha="${DEPLOY_SHA}"
          on_main=false
          if [ "$ref" = "main" ] || [ "$ref" = "refs/heads/main" ]; then
            on_main=true
          else
            if [ -z "$sha" ]; then
              sha="$ref"
            fi
            git fetch --no-tags origin main
            if git merge-base --is-ancestor "$sha" origin/main; then
              on_main=true
            fi
          fi
          echo "on_main=${on_main}" >> "$GITHUB_OUTPUT"
          if [ "$on_main" != "true" ]; then
            echo "deployment is not on main"
          fi
      - uses: actions/setup-node@v7
        if: github.event_name == 'workflow_dispatch' || steps.main.outputs.on_main == 'true'
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        if: github.event_name == 'workflow_dispatch' || steps.main.outputs.on_main == 'true'
      - name: Restore IndexNow marker
        if: github.event_name == 'workflow_dispatch' || steps.main.outputs.on_main == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .indexnow
          ids=""
          if ids="$(gh run list --workflow indexnow-submit.yml --status success --limit 20 --json databaseId --jq '.[].databaseId')"; then
            :
          else
            ids=""
            echo "marker: run list failed"
          fi
          for id in $ids; do
            tmp="$(mktemp -d)"
            if gh run download "$id" --name indexnow-marker --dir "$tmp"; then
              found="$(find "$tmp" -type f -name marker.json -print -quit)"
              if [ -n "$found" ]; then
                mv "$found" .indexnow/marker.json
                rm -rf "$tmp"
                echo "marker: restored from run ${id}"
                break
              fi
            fi
            rm -rf "$tmp"
          done
          if [ ! -f .indexnow/marker.json ]; then
            echo "marker: none"
          fi
      - name: Submit changed URLs
        if: github.event_name == 'deployment_status' && steps.main.outputs.on_main == 'true'
        env:
          INDEXNOW_MARKER_FILE: .indexnow/marker.json
        run: npx tsx scripts/indexnow.ts
      - name: Submit every URL
        if: github.event_name == 'workflow_dispatch'
        env:
          INDEXNOW_MARKER_FILE: .indexnow/marker.json
        run: npx tsx scripts/indexnow.ts --all
      - name: Upload IndexNow marker
        if: success() && (github.event_name == 'workflow_dispatch' || steps.main.outputs.on_main == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-marker
          path: .indexnow/marker.json
          retention-days: 90
          if-no-files-found: ignore
